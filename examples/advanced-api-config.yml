substitutions:
  devicename: nspanel-bedroom
  friendly_devicename: NSPanel Bedroom

esphome:
  name: $devicename

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password

logger:
  level: DEBUG
  logs:
    sensor: WARN
    resistance: WARN
    text_sensor: WARN
    ntc: WARN

ota:
  - platform: esphome

api:
  actions:
    - action: nspanelui_api_call
      variables:
        data: string
        command: int
      then:
        - lambda: |-
            id(nspanel).nspanelui_api_call(data, command);
    - action: upload_tft
      variables:
        url: string
      then:
        - lambda: |-
            id(nspanel).upload_tft(url);
    - action: play_rtttl
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda "return song_str;"
    - action: send_command
      variables:
        cmd: string
      then:
        - lambda: "id(nspanel).send_custom_command(cmd);"
    - action: wake
      then:
        - lambda: 'id(nspanel).send_custom_command("wake");'
    - action: show_screensaver
      then:
        - homeassistant.event:
            event: esphome.nspanel.data
            data:
              device_id: $devicename
              CustomRecv: "event,sleepReached,cardGrid"
    - action: navigate_to_page
      variables:
        page: string
      then:
        - homeassistant.event:
            event: esphome.nspanel.data
            data:
              device_id: $devicename
              CustomRecv: !lambda 'return "event,buttonPress2,navigate." + page + ",button";'
    - action: disable_screensaver
      then:
        - lambda: 'id(nspanel).send_custom_command("timeout~0");'
    - action: enable_screensaver
      then:
        - lambda: 'id(nspanel).send_custom_command("timeout~20");'
    - action: dim_0_to_100
      variables:
        intensity: string
      then:
        - lambda: 'id(nspanel).send_custom_command("dimmode~"+intensity+"~100");'
    - action: show_entity
      variables:
        entity: string
        title: string
      then:
        - lambda: 'id(nspanel).send_custom_command("pageType~popupLight~" + title + "~" + entity);'
    - action: notify_on_screensaver
      variables:
        line1: string
        line2: string
      then:
        - lambda: 'id(nspanel).send_custom_command("notify~" + line1 + "~" + line2);'
        - rtttl.play: "short:d=4,o=5,b=100:16e6"
    - action: notify_fullscreen
      variables:
        title: string
        description: string
        button1: string
        button2: string
        time_secs: string
      then:
        - lambda: 'id(nspanel).send_custom_command("pageType~popupNotify");'
        - lambda: 'id(nspanel).send_custom_command("entityUpdateDetail~id~" + title + "~65535~" + button1 + "~3840~" + button2 + "~61440~" + description + "~65535~" + time_secs);'
        - rtttl.play: "scale_up:d=32,o=5,b=100:c,c#,d#,e,f#,g#,a#,b"

uart:
  tx_pin: 16
  rx_pin: 17
  baud_rate: 115200

external_components:
  - source:
      type: git
      url: https://github.com/sairon/esphome-nspanel-lovelace-ui
      ref: dev
    components: [nspanel_lovelace]

nspanel_lovelace:
  id: nspanel
  connection: api
  api_device_id: $devicename

sensor:
  - platform: adc
    id: ntc_source
    pin: 38
    update_interval: 10s
    attenuation: 12db

  - platform: resistance
    id: resistance_sensor
    sensor: ntc_source
    configuration: DOWNSTREAM
    resistor: 11.2kOhm

  - platform: ntc
    id: temperature
    sensor: resistance_sensor
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    name: $friendly_devicename Temperature
    filters:
      - sliding_window_moving_average:
          window_size: 15
          send_every: 15

output:
  - platform: ledc
    id: buzzer_out
    pin:
      number: 21

rtttl:
  id: buzzer
  output: buzzer_out

switch:
  - platform: gpio
    name: $friendly_devicename Relay 1
    id: relay_1
    pin:
      number: 22
    on_turn_on:
      - lambda: 'id(nspanel).send_custom_command("pageType~popupLight~Light 1~light.bed_light");'
    on_turn_off:
      - homeassistant.event:
          event: esphome.nspanel.data
          data:
            device_id: $devicename
            CustomRecv: "event,sleepReached,cardGrid"

  - platform: gpio
    name: $friendly_devicename Relay 2
    id: relay_2
    pin:
      number: 19
    on_turn_on:
      - lambda: 'id(nspanel).send_custom_command("pageType~popupLight~Light 2~light.bed_light2");'
    on_turn_off:
      - homeassistant.event:
          event: esphome.nspanel.data
          data:
            device_id: $devicename
            CustomRecv: "event,sleepReached,cardGrid"

  - platform: gpio
    name: Screen Power
    id: screen_power
    entity_category: config
    pin:
      number: 4
      inverted: true
    restore_mode: ALWAYS_ON

binary_sensor:
  - platform: gpio
    name: $friendly_devicename Left Button
    pin:
      number: GPIO14
      inverted: true
    id: left_button
    on_press:
      then:
        - switch.turn_on: relay_1

  - platform: gpio
    name: $friendly_devicename Right Button
    pin:
      number: GPIO27
      inverted: true
    id: right_button
    on_press:
      then:
        - switch.toggle: relay_2
