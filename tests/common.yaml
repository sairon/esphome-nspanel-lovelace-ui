external_components:
  - source:
      type: local
      path: ../components
    components: [nspanel_lovelace]

esphome:
  name: nspanel-ci

wifi:
  ssid: ci-ssid
  password: ci-password

mqtt:
  broker: 192.168.1.1

uart:
  - id: tf_uart
    tx_pin: 16
    rx_pin: 17
    baud_rate: 115200

nspanel_lovelace:
  id: nspanel

logger:

api:
  services:
    - service: upload_tft
      variables:
        url: string
      then:
        - lambda: |-
            id(nspanel).upload_tft(url);
